name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reps/web lint
      - run: pnpm --filter @reps/web typecheck
      - run: pnpm --filter @reps/web test
      - run: pnpm --filter @reps/web build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: apps/api
        run: uv sync --frozen --all-groups
      - working-directory: apps/api
        run: uv run ruff check .
      - working-directory: apps/api
        run: uv run mypy app tests
      - working-directory: apps/api
        run: uv run pytest
      - working-directory: apps/api
        run: uv run alembic upgrade head --sql > /tmp/reps-migration.sql
      - working-directory: apps/api
        run: uv run python -m app.corpus.validate --execute

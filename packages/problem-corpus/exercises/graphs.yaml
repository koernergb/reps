schema_version: 1
topic: graphs
exercises:
  - id: gr-recall-model
    capability: graphs.recognition
    type: recall
    prompt: How do you recognize that a grid or dependency problem is a graph problem, and how do you choose BFS, DFS, or topological order?
    key_points:
      - ["node", "vertex", "cell", "course"]
      - ["edge", "neighbor", "adjacent", "dependency"]
      - ["shortest", "level", "minutes", "bfs"]
      - ["order", "cycle", "prerequisite", "topological"]
    reference_answer: Cells or items become nodes and adjacency/dependencies become edges. Use BFS for shortest steps or spreading by levels, DFS or BFS for connectivity, and topological order for dependencies and cycle detection.
    hints:
      - What are the nodes and edges in "count islands"?
    estimated_minutes: 1.5
  - id: gr-explain-visited
    capability: graphs.invariant
    type: explain
    prompt: Why should BFS mark a cell visited when it is enqueued rather than when it is dequeued?
    key_points:
      - ["duplicate", "twice", "multiple times", "more than once", "again"]
      - ["enqueue", "added", "pushed", "queue"]
    reference_answer: Marking on enqueue prevents the same cell from being added to the queue multiple times by different neighbors, which wastes work and can double-count in level-based BFS.
    misconception: It does not matter when you mark nodes visited.
    confirmation_question: In a 2x2 grid of all land starting at the top-left, how many times could the bottom-right cell be enqueued if you mark on dequeue?
    hints:
      - How many neighbors can discover the same cell before it is dequeued?
    estimated_minutes: 2
  - id: gr-explain-cycle-states
    capability: graphs.invariant
    type: explain
    prompt: For cycle detection with DFS on a directed graph, why are three node states (unvisited, in progress, done) needed?
    key_points:
      - ["in progress", "current path", "on the stack", "visiting", "gray"]
      - ["done", "finished", "fully explored", "black", "shared", "diamond"]
    reference_answer: Reaching a node that is in progress means a back edge to the current path, which is a cycle; reaching a node that is done just means a shared descendant (like a diamond), which is not a cycle.
    misconception: Reaching any visited node means there is a cycle.
    confirmation_question: Is there a cycle in edges 0->1, 0->2, 1->3, 2->3? What would a two-state DFS report?
    hints:
      - Think of a diamond-shaped graph.
    estimated_minutes: 2.5
  - id: gr-debug-diagonal
    capability: graphs.boundaries
    type: debug
    problem: number-of-islands
    from_mistake: diagonal-neighbors
    prompt: This island counter merges islands that only touch diagonally. Fix it.
    reference_answer: Explore only the four orthogonal neighbors.
    misconception: Diagonal cells are adjacent.
    hints:
      - Try [[1, 0, 1], [0, 1, 0], [1, 0, 1]].
    estimated_minutes: 3
  - id: gr-debug-multisource
    capability: graphs.transfer
    type: debug
    problem: rotting-oranges
    from_mistake: single-source
    prompt: This spoilage simulation is too slow to spread. Fix it.
    reference_answer: Enqueue every initially spoiled cell before starting BFS (multi-source BFS).
    misconception: BFS always starts from a single source.
    hints:
      - Try [[2, 1, 1, 1, 1, 2]].
    estimated_minutes: 4
  - id: gr-complexity
    capability: graphs.complexity
    type: explain
    prompt: What is the time complexity of Kahn's algorithm, and why?
    key_points:
      - ["o(v + e)", "v + e", "vertices plus edges", "nodes plus edges"]
      - ["each node", "each edge", "once"]
    reference_answer: O(V + E). Every node is enqueued and dequeued once and every edge is examined once when its source is dequeued.
    hints:
      - How many times is each edge looked at?
    estimated_minutes: 1

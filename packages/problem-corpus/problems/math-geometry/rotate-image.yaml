hints:
- State precisely what information must be preserved after processing part of the input.
- Transpose across the main diagonal, then reverse every row.
- 'Boundary check: Reversing rows before transposing produces the opposite rotation.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Transpose across the main diagonal, then reverse every row.
clarifications:
- question: What exact contract should `rotate_image` implement?
  answer: Return the square `matrix` rotated 90 degrees clockwise. Perform the transformation in place and also return the matrix used by the exercise harness.
- question: Which boundary condition is easiest to overlook?
  answer: Reversing rows before transposing produces the opposite rotation.
follow_ups:
- Justify the claimed O(n^2) time and O(1) space bounds.
- 'Design a test that exposes this failure: Reversing rows before transposing produces the opposite rotation.'
common_mistakes:

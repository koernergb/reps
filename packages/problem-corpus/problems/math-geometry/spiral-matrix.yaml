statement: Return every element of the rectangular `matrix` in clockwise spiral order, beginning at the top-left.
examples:
- input:
    matrix:
    - - 1
      - 2
      - 3
    - - 4
      - 5
      - 6
    - - 7
      - 8
      - 9

hints:
- State precisely what information must be preserved after processing part of the input.
- Shrink top, bottom, left, and right boundaries after traversing each side, checking for crossed bounds.
- 'Boundary check: Traversing the bottom or left side after the bounds cross duplicates the center row or column.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Shrink top, bottom, left, and right boundaries after traversing each side, checking for crossed bounds.
clarifications:
- question: What exact contract should `spiral_order` implement?
  answer: Return every element of the rectangular `matrix` in clockwise spiral order, beginning at the top-left.
- question: Which boundary condition is easiest to overlook?
  answer: Traversing the bottom or left side after the bounds cross duplicates the center row or column.
follow_ups:
- Justify the claimed O(rows * cols) time and O(n) space bounds.
- 'Design a test that exposes this failure: Traversing the bottom or left side after the bounds cross duplicates the center row or column.'

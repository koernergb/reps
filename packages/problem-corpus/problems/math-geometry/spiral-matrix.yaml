  "reference_solution": "def spiral_order(matrix):\n    out=[]; top=0; bottom=len(matrix)-1; left=0; right=len(matrix[0])-1\n    while top<=bottom and left<=right:\n        out += matrix[top][left:right+1]; top+=1\n        for r in range(top,bottom+1): out.append(matrix[r][right])\n        right-=1\n        if top<=bottom: out += matrix[bottom][left:right+1][::-1]; bottom-=1\n        if left<=right:\n            for r in range(bottom,top-1,-1): out.append(matrix[r][left])\n            left+=1\n    return out",

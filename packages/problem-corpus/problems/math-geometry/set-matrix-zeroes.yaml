  "reference_solution": "def set_zeroes(matrix):\n    rows=set(); cols=set()\n    for r,row in enumerate(matrix):\n        for c,x in enumerate(row):\n            if x==0: rows.add(r); cols.add(c)\n    for r,row in enumerate(matrix):\n        for c in range(len(row)):\n            if r in rows or c in cols: matrix[r][c]=0\n    return matrix",

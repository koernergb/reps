hints:
- State precisely what information must be preserved after processing part of the input.
- Use the first row and column as marker storage, while preserving separate flags for their original zero state.
- 'Boundary check: Writing zeroes during the initial scan causes newly written zeroes to cascade into unrelated rows and columns.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Use the first row and column as marker storage, while preserving separate flags for their original zero state.
clarifications:
- question: What exact contract should `set_zeroes` implement?
  answer: If an element of `matrix` is zero, set its entire row and column to zero. Mutate and return the matrix while using O(1) auxiliary space beyond a few flags.
- question: Which boundary condition is easiest to overlook?
  answer: Writing zeroes during the initial scan causes newly written zeroes to cascade into unrelated rows and columns.
follow_ups:
- Justify the claimed O(rows * cols) time and O(rows + cols) space bounds.
- 'Design a test that exposes this failure: Writing zeroes during the initial scan causes newly written zeroes to cascade into unrelated rows and columns.'
common_mistakes:
- id: contract-boundary
  description: Writing zeroes during the initial scan causes newly written zeroes to cascade into unrelated rows and columns.
  capability: math-geometry.recognition
- id: sample-overfit
  description: Handles the sample shape but does not implement the general contract.
  capability: math-geometry.recognition

statement: If an element of `matrix` is zero, set its entire row and column to zero. Mutate and return the matrix while using O(1) auxiliary space beyond a few flags.
examples:
- input:
    matrix:
    - - 1
      - 1
      - 1
    - - 1
      - 0
      - 1
    - - 1
      - 1
      - 1
  output:
  - - 1
    - 0
    - 1
  - - 0
    - 0
    - 0
  - - 1
    - 0
    - 1
constraints:
- The total input size is at most 10,000 elements.
- The input structure is valid and rectangular where a matrix is supplied.
kind: function
entrypoint: set_zeroes
input_adapters: []
starter_code: "def set_zeroes(*args):\n    pass"
time_complexity: O(rows * cols)
space_complexity: O(rows + cols)

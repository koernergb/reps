hints:
- State precisely what information must be preserved after processing part of the input.
- Build a trie for all words and share one board DFS, pruning trie branches and removing words once found.
- 'Boundary check: Running independent searches without restoring cells can make one word search corrupt the next.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Build a trie for all words and share one board DFS, pruning trie branches and removing words once found.
clarifications:
- question: What exact contract should `find_words` implement?
  answer: Return every distinct word from `words` that can be formed in the board by orthogonal moves without reusing a cell within a word. Results may be returned in any order.
- question: Which boundary condition is easiest to overlook?
  answer: Running independent searches without restoring cells can make one word search corrupt the next.
follow_ups:
- Justify the claimed O(rows * cols * branching) time and O(n) space bounds.
- 'Design a test that exposes this failure: Running independent searches without restoring cells can make one word search corrupt the next.'

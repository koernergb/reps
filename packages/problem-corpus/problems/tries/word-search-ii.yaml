  "reference_solution": "def find_words(board,words):\n    root={}\n    for word in words:\n        node=root\n        for ch in word: node=node.setdefault(ch,{})\n        node['$']=word\n    out=[]; rows=len(board); cols=len(board[0])\n    def dfs(r,c,node):\n        ch=board[r][c]\n        if ch not in node: return\n        nxt=node[ch]\n        word=nxt.pop('$',None)\n        if word: out.append(word)\n        board[r][c]='#'\n        for dr,dc in ((1,0),(-1,0),(0,1),(0,-1)):\n            nr,nc=r+dr,c+dc\n            if 0<=nr<rows and 0<=nc<cols and board[nr][nc]!='#': dfs(nr,nc,nxt)\n        board[r][c]=ch\n    for r in range(rows):\n        for c in range(cols): dfs(r,c,root)\n    return out",

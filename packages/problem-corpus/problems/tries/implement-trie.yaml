  "reference_solution": "class Trie:\n    def __init__(self): self.root={}\n    def insert(self,word):\n        node=self.root\n        for ch in word: node=node.setdefault(ch,{})\n        node['$']=True\n    def search(self,word):\n        node=self.root\n        for ch in word:\n            if ch not in node: return False\n            node=node[ch]\n        return '$' in node\n    def starts_with(self,prefix):\n        node=self.root\n        for ch in prefix:\n            if ch not in node: return False\n            node=node[ch]\n        return True",

reference_solution: "class WordDictionary:\n    def __init__(self): self.root={}\n    def add_word(self,word):\n        node=self.root\n        for ch in word: node=node.setdefault(ch,{})\n        node['$']=True\n    def search(self,word):\n        def dfs(i,node):\n            if i==len(word): return '$' in node\n            ch=word[i]\n            if ch=='.': return any(k!='$' and dfs(i+1,v) for k,v in node.items())\n            return ch in node and dfs(i+1,node[ch])\n        return dfs(0,self.root)"
wrong_solutions:
- mistake: incomplete-state
  expect: wrong_answer
  code: "class WordDictionary:\n    def __init__(self): self.words=set()\n    def add_word(self,w): self.words.add(w)\n    def search(self,w): return w in self.words"

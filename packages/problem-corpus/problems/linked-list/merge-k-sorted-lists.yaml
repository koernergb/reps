statement: Given `lists`, where each inner list is sorted in nondecreasing order, merge all values into one sorted list. Empty input lists are allowed.
examples:
- input:
    lists:
    - - 1
      - 4
      - 5
    - - 1
      - 3
      - 4
    - - 2
      - 6
  output:
  - 1
  - 1
  - 2
  - 3
  - 4
  - 4
  - 5
  - 6

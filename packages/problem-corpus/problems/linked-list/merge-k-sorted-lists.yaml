  "reference_solution": "def merge_k_lists(lists):\n    import heapq\n    heap=[]; serial=0\n    for node in lists:\n        if node: heapq.heappush(heap,(node.val,serial,node)); serial+=1\n    dummy=ListNode(0); tail=dummy\n    while heap:\n        _,_,node=heapq.heappop(heap); tail.next=node; tail=node\n        if node.next: heapq.heappush(heap,(node.next.val,serial,node.next)); serial+=1\n    return dummy.next",

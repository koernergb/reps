hints:
- State precisely what information must be preserved after processing part of the input.
- Place the first value from each nonempty list in a min-heap and advance only the list whose value was removed.
- 'Boundary check: Concatenating and repeatedly selecting the global minimum without a heap loses the intended O(N log k) bound.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Place the first value from each nonempty list in a min-heap and advance only the list whose value was removed.
clarifications:
- question: What exact contract should `merge_k_lists` implement?
  answer: Given `lists`, where each inner list is sorted in nondecreasing order, merge all values into one sorted list. Empty input lists are allowed.
- question: Which boundary condition is easiest to overlook?
  answer: Concatenating and repeatedly selecting the global minimum without a heap loses the intended O(N log k) bound.
follow_ups:
- Justify the claimed O(N log k) time and O(k) space bounds.
- 'Design a test that exposes this failure: Concatenating and repeatedly selecting the global minimum without a heap loses the intended O(N log k) bound.'

hints:
- State precisely what information must be preserved after processing part of the input.
- Removing the lowest set bit gives the recurrence `bits[i] = bits[i & (i - 1)] + 1`.
- 'Boundary check: Counting each integer from scratch misses the reusable subproblem and costs O(n log n).'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Removing the lowest set bit gives the recurrence `bits[i] = bits[i & (i - 1)] + 1`.
clarifications:
- question: What exact contract should `count_bits` implement?
  answer: For every integer `i` from 0 through `n`, return the number of set bits in the binary representation of `i`.
- question: Which boundary condition is easiest to overlook?
  answer: Counting each integer from scratch misses the reusable subproblem and costs O(n log n).

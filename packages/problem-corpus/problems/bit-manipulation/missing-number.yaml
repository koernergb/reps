hints:
- State precisely what information must be preserved after processing part of the input.
- XOR every index and value (or compare expected and actual sums) so paired values cancel.
- 'Boundary check: Using the array length as the largest included value causes an off-by-one error when `n` is missing.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: XOR every index and value (or compare expected and actual sums) so paired values cancel.
clarifications:

reference_solution: "def bit_sum(a,b):\n    mask=0xffffffff\n    while b & mask: a,b=(a^b)&mask,((a&b)<<1)&mask\n    return a if a<0x80000000 else ~(a^mask)"
wrong_solutions:
- mistake: sample-overfit
  expect: wrong_answer
  code: "def bit_sum(*args):\n    return 3"

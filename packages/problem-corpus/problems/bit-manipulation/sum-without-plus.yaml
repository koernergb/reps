hints:
- State precisely what information must be preserved after processing part of the input.
- XOR computes the sum without carries; shifted AND computes carries. Apply a 32-bit mask until no carry remains.
- 'Boundary check: Python integers do not overflow, so negative carry propagation never ends without a fixed-width mask.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: XOR computes the sum without carries; shifted AND computes carries. Apply a 32-bit mask until no carry remains.
clarifications:
- question: What exact contract should `bit_sum` implement?
  answer: Return the sum of integers `a` and `b` without using `+` or `-`. Match ordinary signed 32-bit integer behavior.
- question: Which boundary condition is easiest to overlook?
  answer: Python integers do not overflow, so negative carry propagation never ends without a fixed-width mask.
follow_ups:

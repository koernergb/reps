schema_version: 1
slug: find-sorted-value
version: 2
status: development
title: Find a Sorted Value
topic: binary-search
patterns: [exact-binary-search]
role: canonical
difficulty: easy
transfer_group: exact-search
prerequisites: []
related: [first-at-least, search-rotated]
statement: |
  Given an ascending list of distinct integers `nums` and a `target`, return the index of
  `target`, or `-1` if it is absent. Your solution must run in O(log n) time.
examples:
  - input: {nums: [-3, 0, 5, 12], target: 5}
    output: 2
constraints:
  - 0 <= len(nums) <= 100,000
  - Values are strictly increasing.
entrypoint: find_sorted_value
starter_code: |
  def find_sorted_value(nums: list[int], target: int) -> int:
      pass
time_complexity: O(log n)
space_complexity: O(1)
capabilities:
  - {slug: binary-search.recognition, weight: 0.2}
  - {slug: binary-search.invariant, weight: 0.2}
  - {slug: binary-search.implementation, weight: 0.3}
  - {slug: binary-search.boundaries, weight: 0.15}
  - {slug: binary-search.complexity, weight: 0.15}
hints:
  - The list is sorted. What does comparing target with one middle value tell you?
  - After one comparison you can discard half the candidates. Which half?
  - "Keep an inclusive range [left, right] that must contain target if it exists; shrink it using the middle element."
  - "Loop while left <= right; if nums[mid] < target move left to mid + 1, else if greater move right to mid - 1."
  - "left, right = 0, len(nums) - 1; while left <= right: mid = (left + right) // 2; compare and move past mid; return -1."
key_insight: Keep an inclusive range that must contain the target if present, and discard the half that cannot, always moving past the middle so the range shrinks.
clarifications:
  - question: Can the list be empty?
    answer: Yes. Return -1.
  - question: Are values distinct?
    answer: Yes.
follow_ups:
  - Why is the running time logarithmic?
  - How would you find the first occurrence if duplicates were allowed?
common_mistakes:
  - id: strict-loop
    description: Uses while left < right with inclusive bounds and skips the last candidate.
    capability: binary-search.boundaries
  - id: no-progress
    description: Sets left = mid (or right = mid) and can loop forever.
    capability: binary-search.implementation
visible_tests:
  - {args: [[-3, 0, 5, 12], 5], expected: 2}
  - {args: [[1, 4, 8], 6], expected: -1}
hidden_tests:
  - {args: [[], 1], expected: -1}
  - {args: [[7], 7], expected: 0, label: single element}
  - {args: [[1, 3, 9, 20], 20], expected: 3}
  - {args: [[1, 3, 9, 20], 1], expected: 0}
  - {args: [[2, 4], 3], expected: -1}
  - {args: [[2, 4], 5], expected: -1}
reference_solution: |
  def find_sorted_value(nums, target):
      left, right = 0, len(nums) - 1
      while left <= right:
          middle = left + (right - left) // 2
          if nums[middle] == target:
              return middle
          if nums[middle] < target:
              left = middle + 1
          else:
              right = middle - 1
      return -1
wrong_solutions:
  - mistake: strict-loop
    expect: wrong_answer
    code: |
      def find_sorted_value(nums, target):
          left, right = 0, len(nums) - 1
          while left < right:
              middle = (left + right) // 2
              if nums[middle] == target:
                  return middle
              if nums[middle] < target:
                  left = middle + 1
              else:
                  right = middle - 1
          return -1
  - mistake: no-progress
    expect: timeout
    code: |
      def find_sorted_value(nums, target):
          left, right = 0, len(nums) - 1
          while left <= right:
              middle = (left + right) // 2
              if nums[middle] == target:
                  return middle
              if nums[middle] < target:
                  left = middle
              else:
                  right = middle - 1
          return -1

schema_version: 1
slug: search-rotated
version: 1
status: development
title: Search a Rotated List
topic: binary-search
patterns: [binary-search, sorted-half]
role: transfer
difficulty: medium
transfer_group: exact-search
prerequisites: [find-sorted-value]
related: [find-sorted-value]
statement: |
  An ascending list of distinct integers was rotated at an unknown pivot (for example
  `[0, 1, 2, 4, 5, 6, 7]` might become `[4, 5, 6, 7, 0, 1, 2]`). Return the index of
  `target`, or `-1` if it is absent, in O(log n) time.
examples:
  - input: {nums: [4, 5, 6, 7, 0, 1, 2], target: 0}
    output: 4
constraints:
  - 1 <= len(nums) <= 5,000
  - Values are distinct. The list may also be unrotated.
entrypoint: search_rotated
starter_code: |
  def search_rotated(nums: list[int], target: int) -> int:
      pass
time_complexity: O(log n)
space_complexity: O(1)
capabilities:
  - {slug: binary-search.recognition, weight: 0.15}
  - {slug: binary-search.invariant, weight: 0.2}
  - {slug: binary-search.implementation, weight: 0.15}
  - {slug: binary-search.boundaries, weight: 0.15}
  - {slug: binary-search.complexity, weight: 0.05}
  - {slug: binary-search.transfer, weight: 0.3}
hints:
  - Pick any middle index. Is at least one side of it guaranteed to be sorted?
  - Compare nums[left] with nums[mid] to decide which half is sorted.
  - If the sorted half's range contains target, search there; otherwise search the other half.
  - "When left == mid the left half is a single element; use nums[left] <= nums[mid] so that case counts as sorted."
  - "if nums[left] <= nums[mid]: go left if nums[left] <= target < nums[mid] else right; else: go right if nums[mid] < target <= nums[right] else left."
key_insight: At every step one half around mid is sorted; check whether target lies within that sorted half's range to decide which half to keep.
clarifications:
  - question: Might the list not be rotated at all?
    answer: Yes, rotation by zero is possible.
  - question: Are there duplicates?
    answer: No.
follow_ups:
  - What breaks if duplicates are allowed?
  - How would you find the rotation point itself?
common_mistakes:
  - id: strict-sorted-check
    description: Uses nums[left] < nums[mid], misclassifying two-element ranges.
    capability: binary-search.boundaries
  - id: linear-scan
    description: Scans the list linearly.
    capability: binary-search.transfer
visible_tests:
  - {args: [[4, 5, 6, 7, 0, 1, 2], 0], expected: 4}
  - {args: [[4, 5, 6, 7, 0, 1, 2], 3], expected: -1}
hidden_tests:
  - {args: [[1], 0], expected: -1}
  - {args: [[1], 1], expected: 0}
  - {args: [[3, 1], 1], expected: 1, label: two elements}
  - {args: [[5, 1, 3], 5], expected: 0}
  - {args: [[1, 3], 3], expected: 1}
  - {args: [[6, 7, 1, 2, 3, 4, 5], 6], expected: 0}
reference_solution: |
  def search_rotated(nums, target):
      left, right = 0, len(nums) - 1
      while left <= right:
          middle = (left + right) // 2
          if nums[middle] == target:
              return middle
          if nums[left] <= nums[middle]:
              if nums[left] <= target < nums[middle]:
                  right = middle - 1
              else:
                  left = middle + 1
          else:
              if nums[middle] < target <= nums[right]:
                  left = middle + 1
              else:
                  right = middle - 1
      return -1
wrong_solutions:
  - mistake: strict-sorted-check
    expect: wrong_answer
    code: |
      def search_rotated(nums, target):
          left, right = 0, len(nums) - 1
          while left <= right:
              middle = (left + right) // 2
              if nums[middle] == target:
                  return middle
              if nums[left] < nums[middle]:
                  if nums[left] <= target < nums[middle]:
                      right = middle - 1
                  else:
                      left = middle + 1
              else:
                  if nums[middle] < target <= nums[right]:
                      left = middle + 1
                  else:
                      right = middle - 1
          return -1

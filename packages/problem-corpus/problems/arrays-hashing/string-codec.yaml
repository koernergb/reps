  "reference_solution": "class StringCodec:\n    def encode(self, strings):\n        return ''.join(str(len(s)) + '#' + s for s in strings)\n    def decode(self, data):\n        out=[]; i=0\n        while i < len(data):\n            j=i\n            while data[j] != '#': j += 1\n            size=int(data[i:j]); j += 1\n            out.append(data[j:j+size]); i=j+size\n        return out",

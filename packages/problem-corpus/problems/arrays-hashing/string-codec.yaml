hints:
- State precisely what information must be preserved after processing part of the input.
- Prefix every string with its character length and a separator, then consume exactly that many characters while decoding.
- 'Boundary check: Splitting on a delimiter is ambiguous when the delimiter occurs inside a value.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Prefix every string with its character length and a separator, then consume exactly that many characters while decoding.
clarifications:
- question: What exact contract should `StringCodec` implement?
  answer: Design a codec that converts a list of arbitrary strings into one string and decodes it without loss. Strings may be empty and may contain any delimiter you choose. Implement `StringCodec.encode` and `StringCodec.decode`.
- question: Which boundary condition is easiest to overlook?
  answer: Splitting on a delimiter is ambiguous when the delimiter occurs inside a value.
follow_ups:
- Justify the claimed O(total characters) per operation time and O(n) space bounds.
- 'Design a test that exposes this failure: Splitting on a delimiter is ambiguous when the delimiter occurs inside a value.'

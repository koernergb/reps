  weight: 0.2
- slug: graphs.complexity
  weight: 0.1
- slug: graphs.transfer
  weight: 0.1
hints:
- State precisely what information must be preserved after processing part of the input.
- The first differing character in each adjacent word pair creates one directed edge; then perform a deterministic topological sort.
- 'Boundary check: Ignoring the invalid case where a longer word precedes its exact prefix accepts an impossible dictionary.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: The first differing character in each adjacent word pair creates one directed edge; then perform a deterministic topological sort.
clarifications:
- question: What exact contract should `alien_order` implement?
  answer: 'Given words sorted according to an unknown lowercase alphabet, return one valid ordering of all letters. Return an empty string if the ordering is impossible. The output must be deterministic: choose the lexicographically smallest available letter.'
- question: Which boundary condition is easiest to overlook?
  answer: Ignoring the invalid case where a longer word precedes its exact prefix accepts an impossible dictionary.
follow_ups:
- Justify the claimed O(n) time and O(n) space bounds.
- 'Design a test that exposes this failure: Ignoring the invalid case where a longer word precedes its exact prefix accepts an impossible dictionary.'
common_mistakes:

prerequisites: []
related: []
statement: 'Given words sorted according to an unknown lowercase alphabet, return one valid ordering of all letters. Return an empty string if the ordering is impossible. The output must be deterministic: choose the lexicographically smallest available letter.'
examples:
- input:
    words:
    - wrt
    - wrf
    - er
    - ett
    - rftt
  output: wertf
constraints:
- The total input size is at most 10,000 elements.
- The input structure is valid and rectangular where a matrix is supplied.
kind: function
entrypoint: alien_order
input_adapters: []
starter_code: "def alien_order(*args):\n    pass"
time_complexity: O(n)
space_complexity: O(n)

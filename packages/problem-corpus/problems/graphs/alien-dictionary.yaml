  "reference_solution": "def alien_order(words):\n    graph={c:set() for w in words for c in w}; indegree={c:0 for c in graph}\n    for a,b in zip(words,words[1:]):\n        if len(a)>len(b) and a.startswith(b): return ''\n        for x,y in zip(a,b):\n            if x!=y:\n                if y not in graph[x]: graph[x].add(y); indegree[y]+=1\n                break\n    queue=sorted([c for c,d in indegree.items() if d==0],reverse=True); out=[]\n    while queue:\n        c=queue.pop(); out.append(c)\n        for nxt in sorted(graph[c],reverse=True):\n            indegree[nxt]-=1\n            if indegree[nxt]==0: queue.append(nxt); queue.sort(reverse=True)\n    return ''.join(out) if len(out)==len(graph) else ''",

schema_version: 1
slug: valid-tree
version: 1
status: development
title: Validate an Undirected Tree
topic: graphs
patterns: [graph-traversal]
role: transfer
difficulty: medium
collections: [blind-75]
transfer_group: graph-traversal
prerequisites: [number-of-islands]
related: [connected-components]
statement: Given `n` nodes numbered 0 through n-1 and undirected edges, return whether they form exactly one tree.
examples:
  - {input: {n: 5, edges: [[0, 1], [0, 2], [0, 3], [1, 4]]}, output: true}
constraints: ["1 <= n <= 100,000", "Edges contain distinct endpoint pairs and no self-loops."]
entrypoint: is_valid_tree
starter_code: |
  def is_valid_tree(n: int, edges: list[list[int]]) -> bool:
      pass
time_complexity: O(n + e)
space_complexity: O(n + e)
capabilities:
  - {slug: graphs.recognition, weight: 0.2}
  - {slug: graphs.invariant, weight: 0.3}
  - {slug: graphs.implementation, weight: 0.2}
  - {slug: graphs.boundaries, weight: 0.2}
  - {slug: graphs.complexity, weight: 0.1}
hints:
  - A tree must be connected and acyclic.
  - For n nodes, what exact edge count must every tree have?
  - Reject immediately unless there are n-1 edges.
  - Build an adjacency list and traverse from node 0.
  - With n-1 edges, visiting all n nodes is enough to prove the graph is a tree.
key_insight: An undirected graph is a tree exactly when it has n-1 edges and all n nodes are connected.
clarifications:
  - question: Is a single node with no edges a tree?
    answer: Yes.
  - question: Can the input contain parallel edges?
    answer: No.
follow_ups:
  - How would union-find solve this?
  - How would you identify the cycle?
common_mistakes:
  - {id: edge-count-only, description: Checks n-1 edges but never verifies connectivity., capability: graphs.invariant}
visible_tests:
  - {args: [5, [[0, 1], [0, 2], [0, 3], [1, 4]]], expected: true}
  - {args: [5, [[0, 1], [1, 2], [2, 3], [1, 3], [1, 4]]], expected: false}
hidden_tests:
  - {args: [1, []], expected: true}
  - {args: [4, [[0, 1], [2, 3], [2, 3]]], expected: false, label: disconnected}
  - {args: [3, [[0, 1], [1, 2]]], expected: true}
reference_solution: |
  def is_valid_tree(n, edges):
      if len(edges) != n - 1:
          return False
      graph = [[] for _ in range(n)]
      for a, b in edges:
          graph[a].append(b)
          graph[b].append(a)
      seen = {0}
      stack = [0]
      while stack:
          node = stack.pop()
          for neighbor in graph[node]:
              if neighbor not in seen:
                  seen.add(neighbor)
                  stack.append(neighbor)
      return len(seen) == n
wrong_solutions:
  - mistake: edge-count-only
    expect: wrong_answer
    code: |
      def is_valid_tree(n, edges):
          return len(edges) == n - 1

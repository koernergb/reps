hints:
- State precisely what information must be preserved after processing part of the input.
- Search backward from each ocean into equal-or-higher neighbors, then intersect the two reachable sets.
- 'Boundary check: Running a fresh downhill search from every cell repeats work and commonly mishandles equal-height plateaus.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Search backward from each ocean into equal-or-higher neighbors, then intersect the two reachable sets.
clarifications:

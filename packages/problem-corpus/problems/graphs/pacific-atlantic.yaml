  "reference_solution": "def pacific_atlantic(heights):\n    rows=len(heights); cols=len(heights[0])\n    def reach(starts):\n        seen=set(starts); stack=list(starts)\n        while stack:\n            r,c=stack.pop()\n            for dr,dc in ((1,0),(-1,0),(0,1),(0,-1)):\n                nr,nc=r+dr,c+dc\n                if 0<=nr<rows and 0<=nc<cols and (nr,nc) not in seen and heights[nr][nc]>=heights[r][c]: seen.add((nr,nc)); stack.append((nr,nc))\n        return seen\n    pac=reach([(0,c) for c in range(cols)]+[(r,0) for r in range(rows)])\n    atl=reach([(rows-1,c) for c in range(cols)]+[(r,cols-1) for r in range(rows)])\n    return [list(x) for x in pac&atl]",

prerequisites: []
related: []
statement: The graph is represented by a 1-indexed adjacency list for a connected undirected graph. Return an independent deep copy as an adjacency list with the same neighbor order.
examples:
- input:
    adjacency:
    - - 2
      - 4
    - - 1
      - 3
    - - 2
      - 4
    - - 1
      - 3
  output:
  - - 2
    - 4
  - - 1
    - 3
  - - 2
    - 4
  - - 1
    - 3
constraints:
- The total input size is at most 10,000 elements.
- The input structure is valid and rectangular where a matrix is supplied.
kind: function
entrypoint: clone_graph
input_adapters: []
starter_code: "def clone_graph(*args):\n    pass"
time_complexity: O(n)
space_complexity: O(n)

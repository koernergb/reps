  weight: 0.1
hints:
- State precisely what information must be preserved after processing part of the input.
- Create each node exactly once and memoize old-to-new identity before recursively or iteratively cloning neighbors.
- 'Boundary check: Copying only adjacency values without identity memoization duplicates nodes on cycles.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Create each node exactly once and memoize old-to-new identity before recursively or iteratively cloning neighbors.
clarifications:
- question: What exact contract should `clone_graph` implement?
  answer: The graph is represented by a 1-indexed adjacency list for a connected undirected graph. Return an independent deep copy as an adjacency list with the same neighbor order.
- question: Which boundary condition is easiest to overlook?
  answer: Copying only adjacency values without identity memoization duplicates nodes on cycles.
follow_ups:
- Justify the claimed O(n) time and O(n) space bounds.
- 'Design a test that exposes this failure: Copying only adjacency values without identity memoization duplicates nodes on cycles.'
common_mistakes:

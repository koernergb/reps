hints:
- State precisely what information must be preserved after processing part of the input.
- At each value, choose between starting a new subarray and extending the best subarray ending immediately before it.
- 'Boundary check: Initializing the best sum to zero incorrectly returns zero for an all-negative array.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: At each value, choose between starting a new subarray and extending the best subarray ending immediately before it.
clarifications:
- question: What exact contract should `max_subarray` implement?
  answer: Return the largest sum of a nonempty contiguous subarray of `nums`.
- question: Which boundary condition is easiest to overlook?
  answer: Initializing the best sum to zero incorrectly returns zero for an all-negative array.

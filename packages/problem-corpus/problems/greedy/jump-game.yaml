hints:
- State precisely what information must be preserved after processing part of the input.
- Scan while maintaining the farthest reachable index; fail as soon as the scan reaches a position beyond it.
- 'Boundary check: Assuming the maximum jump must be taken can skip a route that requires a shorter jump.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Scan while maintaining the farthest reachable index; fail as soon as the scan reaches a position beyond it.
clarifications:
- question: What exact contract should `can_jump` implement?
  answer: '`nums[i]` is the maximum forward jump length from index `i`. Return whether the last index is reachable from index 0.'
- question: Which boundary condition is easiest to overlook?
  answer: Assuming the maximum jump must be taken can skip a route that requires a shorter jump.
follow_ups:
- Justify the claimed O(n) time and O(1) space bounds.
- 'Design a test that exposes this failure: Assuming the maximum jump must be taken can skip a route that requires a shorter jump.'
common_mistakes:
- id: contract-boundary
  description: Assuming the maximum jump must be taken can skip a route that requires a shorter jump.
  capability: greedy.recognition
- id: sample-overfit
  description: Handles the sample shape but does not implement the general contract.
  capability: greedy.recognition
visible_tests:
- args:
  - - 2
    - 3
    - 1
    - 1
    - 4
  expected: true
hidden_tests:
- args:
  - - 3
    - 2
    - 1
    - 0
    - 4
  expected: false
- args:
  - - 0
  expected: true
reference_solution: "def can_jump(nums):\n    reach=0\n    for i,jump in enumerate(nums):\n        if i>reach: return False\n        reach=max(reach,i+jump)\n    return True"
wrong_solutions:
- mistake: sample-overfit
  expect: wrong_answer
  code: "def can_jump(*args):\n    return True"

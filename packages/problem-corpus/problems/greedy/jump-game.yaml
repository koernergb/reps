statement: '`nums[i]` is the maximum forward jump length from index `i`. Return whether the last index is reachable from index 0.'
examples:
- input:
    nums:
    - 2
    - 3
    - 1
    - 1
    - 4
  output: true
constraints:
- 1 <= input length <= 20,000 where a sequence is supplied.
- Inputs fit signed 32-bit values unless the statement specifies unsigned values.

schema_version: 1
slug: invert-tree
version: 1
status: development
title: Mirror a Binary Tree
topic: trees
patterns: [tree-recursion]
role: canonical
difficulty: easy
transfer_group: tree-recursion
prerequisites: [max-depth]
related: [max-depth]
statement: |
  Mirror a binary tree so that every node's left and right children are swapped, and return
  the root.
examples:
  - input: {root: [4, 2, 7, 1, 3, 6, 9]}
    output: [4, 7, 2, 9, 6, 3, 1]
constraints:
  - 0 <= number of nodes <= 10,000
  - The tree height is at most 500.
entrypoint: invert_tree
input_adapters: [tree]
output_adapter: tree
starter_code: |
  def invert_tree(root: "TreeNode | None") -> "TreeNode | None":
      pass
time_complexity: O(n)
space_complexity: O(h)
capabilities:
  - {slug: trees.recognition, weight: 0.2}
  - {slug: trees.invariant, weight: 0.3}
  - {slug: trees.implementation, weight: 0.3}
  - {slug: trees.boundaries, weight: 0.1}
  - {slug: trees.complexity, weight: 0.1}
hints:
  - Mirroring the whole tree means mirroring which parts?
  - Swapping the root's children is not enough; the subtrees themselves must be mirrored too.
  - Recursively mirror both subtrees, then swap them (or swap first, then recurse).
  - Be careful not to overwrite root.left before you have used it.
  - "if root: root.left, root.right = invert_tree(root.right), invert_tree(root.left); return root."
key_insight: Mirroring a tree is swapping the root's children after (or before) recursively mirroring each subtree.
clarifications:
  - question: Should I modify the tree in place?
    answer: Yes, returning the same root is fine.
  - question: Can the tree be empty?
    answer: Yes. Return None.
follow_ups:
  - Can you do it iteratively?
  - How would you check whether a tree is symmetric?
common_mistakes:
  - id: swaps-root-only
    description: Swaps only the root's children without recursing.
    capability: trees.invariant
  - id: overwrites-before-use
    description: Assigns root.left before recursing on the original left subtree.
    capability: trees.implementation
visible_tests:
  - {args: [[4, 2, 7, 1, 3, 6, 9]], expected: [4, 7, 2, 9, 6, 3, 1]}
  - {args: [[2, 1, 3]], expected: [2, 3, 1]}
hidden_tests:
  - {args: [[]], expected: []}
  - {args: [[1]], expected: [1]}
  - {args: [[1, 2]], expected: [1, null, 2]}
  - {args: [[1, 2, 3, 4, null, null, 5]], expected: [1, 3, 2, 5, null, null, 4]}
reference_solution: |
  def invert_tree(root):
      if root is None:
          return None
      root.left, root.right = invert_tree(root.right), invert_tree(root.left)
      return root
wrong_solutions:
  - mistake: swaps-root-only
    expect: wrong_answer
    code: |
      def invert_tree(root):
          if root is not None:
              root.left, root.right = root.right, root.left
          return root
  - mistake: overwrites-before-use
    expect: wrong_answer
    code: |
      def invert_tree(root):
          if root is None:
              return None
          root.left = invert_tree(root.right)
          root.right = invert_tree(root.left)
          return root

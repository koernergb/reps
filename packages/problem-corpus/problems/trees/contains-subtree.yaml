schema_version: 1
slug: contains-subtree
version: 1
status: development
title: Find a Matching Subtree
topic: trees
patterns: [tree-search, paired-recursion]
role: transfer
difficulty: easy
collections: [blind-75]
transfer_group: paired-tree-recursion
prerequisites: [same-tree-shape-values]
related: [same-tree-shape-values]
statement: |
  Return `True` if `candidate` occurs inside `root` as a subtree with identical structure and
  values. An empty candidate is a subtree of every tree.
examples:
  - input: {root: [3, 4, 5, 1, 2], candidate: [4, 1, 2]}
    output: true
  - input: {root: [3, 4, 5, 1, 2, null, null, null, null, 0], candidate: [4, 1, 2]}
    output: false
constraints: ["0 <= total nodes <= 100,000", "Node values fit in signed 32-bit integers."]
entrypoint: contains_matching_subtree
input_adapters: [tree, tree]
comparison: exact
starter_code: |
  def contains_matching_subtree(root: TreeNode | None, candidate: TreeNode | None) -> bool:
      pass
time_complexity: O(n * m) worst case
space_complexity: O(h)
capabilities:
  - {slug: trees.recognition, weight: 0.2}
  - {slug: trees.invariant, weight: 0.3}
  - {slug: trees.implementation, weight: 0.25}
  - {slug: trees.boundaries, weight: 0.15}
  - {slug: trees.complexity, weight: 0.1}
hints:
  - Every node in the larger tree is a possible match root.
  - Separate “search for a starting node” from “compare two complete trees.”
  - At each root node, test equality or recurse into either child.
  - Handle an empty candidate before an empty root.
  - "same(root, candidate) or contains(root.left, candidate) or contains(root.right, candidate)"
key_insight: Search every possible root while using a separate exact-tree comparison to verify complete structure.
clarifications:
  - {question: "Is an empty candidate a subtree?", answer: "Yes."}
follow_ups: ["How could serialization and hashing improve repeated comparisons?"]
common_mistakes:
  - id: immediate-children-only
    description: Checks only the root and its immediate children rather than searching all depths.
    capability: trees.implementation
visible_tests:
  - {args: [[3, 4, 5, 1, 2], [4, 1, 2]], expected: true}
  - {args: [[3, 4, 5, 1, 2, null, null, null, null, 0], [4, 1, 2]], expected: false}
hidden_tests:
  - {args: [[1, 2, 3, 4], [2, 4]], expected: true}
  - {args: [[1], []], expected: true}
  - {args: [[], [1]], expected: false}
  - {args: [[1, 2, 3, 4, null, null, null, 5], [4, 5]], expected: true, label: deep match}
reference_solution: |
  def contains_matching_subtree(root, candidate):
      def same(first, second):
          if first is None or second is None:
              return first is second
          return (first.val == second.val and same(first.left, second.left)
                  and same(first.right, second.right))
      if candidate is None:
          return True
      if root is None:
          return False
      return (same(root, candidate) or contains_matching_subtree(root.left, candidate)
              or contains_matching_subtree(root.right, candidate))
wrong_solutions:
  - mistake: immediate-children-only
    expect: wrong_answer
    code: |
      def contains_matching_subtree(root, candidate):
          if candidate is None: return True
          if root is None: return False
          return root.val == candidate.val or (root.left and root.left.val == candidate.val) or (root.right and root.right.val == candidate.val)

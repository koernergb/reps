schema_version: 1
slug: lca-bst
version: 1
status: development
title: Lowest Common Ancestor in a Search Tree
topic: trees
patterns: [bounded-recursion]
role: transfer
difficulty: medium
collections: [blind-75]
transfer_group: bounded-recursion
prerequisites: [validate-bst]
related: [kth-smallest-bst]
statement: |
  Given the root of a binary search tree and two distinct values `p` and `q` that occur in
  the tree, return the value of their lowest common ancestor. A node may be its own ancestor.
examples:
  - input: {root: [6, 2, 8, 0, 4, 7, 9, null, null, 3, 5], p: 2, q: 8}
    output: 6
constraints: ["2 <= number of nodes <= 100,000", "All node values are unique.", "p and q occur in the tree."]
entrypoint: lowest_common_ancestor
input_adapters: [tree, null, null]
starter_code: |
  def lowest_common_ancestor(root: "TreeNode", p: int, q: int) -> int:
      pass
time_complexity: O(h)
space_complexity: O(1)
capabilities:
  - {slug: trees.recognition, weight: 0.2}
  - {slug: trees.invariant, weight: 0.3}
  - {slug: trees.implementation, weight: 0.2}
  - {slug: trees.boundaries, weight: 0.2}
  - {slug: trees.complexity, weight: 0.1}
hints:
  - The BST ordering tells you which side contains both targets.
  - Normalize the targets so `low <= high`.
  - If the current value is below both targets, move right.
  - If it is above both targets, move left.
  - Otherwise the targets split—or one equals the current node—so this is the LCA.
key_insight: The first node whose value lies between the two target values is their lowest common ancestor.
clarifications:
  - question: Can one target be the ancestor?
    answer: Yes; then that target is the answer.
  - question: Should I return a node?
    answer: Return the ancestor's integer value.
follow_ups:
  - How would this change for an ordinary binary tree?
  - Can you write the recursive version?
common_mistakes:
  - {id: always-searches-left, description: Uses ordinary tree traversal and returns the first matching target rather than the split point., capability: trees.invariant}
visible_tests:
  - {args: [[6, 2, 8, 0, 4, 7, 9, null, null, 3, 5], 2, 8], expected: 6}
  - {args: [[6, 2, 8, 0, 4, 7, 9, null, null, 3, 5], 2, 4], expected: 2}
hidden_tests:
  - {args: [[2, 1, 3], 1, 3], expected: 2}
  - {args: [[5, 3, 8, 2, 4, 7, 9], 7, 9], expected: 8}
  - {args: [[5, 3, 8, 2, 4, 7, 9], 4, 2], expected: 3, label: reversed targets}
reference_solution: |
  def lowest_common_ancestor(root, p, q):
      low, high = sorted((p, q))
      node = root
      while node:
          if node.val < low:
              node = node.right
          elif node.val > high:
              node = node.left
          else:
              return node.val
wrong_solutions:
  - mistake: always-searches-left
    expect: wrong_answer
    code: |
      def lowest_common_ancestor(root, p, q):
          if root.val == p or root.val == q:
              return root.val
          return lowest_common_ancestor(root.left, p, q)

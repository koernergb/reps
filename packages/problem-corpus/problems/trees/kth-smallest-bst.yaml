schema_version: 1
slug: kth-smallest-bst
version: 1
status: development
title: Kth Smallest Value in a Search Tree
topic: trees
patterns: [bounded-recursion]
role: transfer
difficulty: medium
collections: [blind-75]
transfer_group: bounded-recursion
prerequisites: [validate-bst]
related: [lca-bst]
statement: Given a binary search tree and a 1-indexed integer `k`, return its kth smallest value.
examples:
  - {input: {root: [3, 1, 4, null, 2], k: 1}, output: 1}
constraints: ["1 <= k <= number of nodes <= 100,000", "All values satisfy the BST invariant."]
entrypoint: kth_smallest
input_adapters: [tree, null]
starter_code: |
  def kth_smallest(root: "TreeNode", k: int) -> int:
      pass
time_complexity: O(h + k)
space_complexity: O(h)
capabilities:
  - {slug: trees.recognition, weight: 0.2}
  - {slug: trees.invariant, weight: 0.3}
  - {slug: trees.implementation, weight: 0.25}
  - {slug: trees.boundaries, weight: 0.15}
  - {slug: trees.complexity, weight: 0.1}
hints:
  - Which traversal visits BST values in sorted order?
  - Use a stack to simulate recursion.
  - Push the entire left spine before visiting a node.
  - Decrement k when a node is popped, not when it is pushed.
  - When k reaches zero, return that node's value.
key_insight: In-order traversal of a BST produces values in ascending order, so stop after the kth visit.
clarifications:
  - question: Is k zero-indexed?
    answer: No; k=1 asks for the minimum.
  - question: Can the tree be skewed?
    answer: Yes.
follow_ups:
  - How would you support frequent kth-smallest queries?
  - What metadata would each node store?
common_mistakes:
  - {id: preorder-count, description: Counts nodes before traversing their left subtree., capability: trees.invariant}
visible_tests:
  - {args: [[3, 1, 4, null, 2], 1], expected: 1}
  - {args: [[5, 3, 6, 2, 4, null, null, 1], 3], expected: 3}
hidden_tests:
  - {args: [[1], 1], expected: 1}
  - {args: [[2, 1, 3], 3], expected: 3}
  - {args: [[4, 2, 6, 1, 3, 5, 7], 4], expected: 4}
reference_solution: |
  def kth_smallest(root, k):
      stack = []
      node = root
      while True:
          while node:
              stack.append(node)
              node = node.left
          node = stack.pop()
          k -= 1
          if k == 0:
              return node.val
          node = node.right
wrong_solutions:
  - mistake: preorder-count
    expect: wrong_answer
    code: |
      def kth_smallest(root, k):
          stack = [root]
          seen = 0
          while stack:
              node = stack.pop()
              seen += 1
              if seen == k:
                  return node.val
              if node.right:
                  stack.append(node.right)
              if node.left:
                  stack.append(node.left)

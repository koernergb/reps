schema_version: 1
slug: build-tree-traversals
version: 1
status: development
title: Build a Tree From Traversals
topic: trees
patterns: [bounded-recursion]
role: transfer
difficulty: medium
collections: [blind-75]
transfer_group: bounded-recursion
prerequisites: [max-depth]
related: [level-order]
statement: Build and return the binary tree described by its preorder and inorder traversals. All values are unique.
examples:
  - {input: {preorder: [3, 9, 20, 15, 7], inorder: [9, 3, 15, 20, 7]}, output: [3, 9, 20, null, null, 15, 7]}
constraints: ["0 <= number of nodes <= 3,000", "preorder and inorder contain the same unique values."]
entrypoint: build_tree
output_adapter: tree
starter_code: |
  def build_tree(preorder: list[int], inorder: list[int]) -> "TreeNode | None":
      pass
time_complexity: O(n)
space_complexity: O(n)
capabilities:
  - {slug: trees.recognition, weight: 0.15}
  - {slug: trees.invariant, weight: 0.3}
  - {slug: trees.implementation, weight: 0.3}
  - {slug: trees.boundaries, weight: 0.15}
  - {slug: trees.complexity, weight: 0.1}
hints:
  - The first unused preorder value is the current subtree's root.
  - Its inorder position separates left and right subtrees.
  - Build a value-to-inorder-index map once.
  - Recurse on inorder index ranges rather than slicing arrays.
  - Advance one shared preorder index each time you create a node.
key_insight: Preorder chooses each root; that root's inorder index uniquely determines the two subtree ranges.
clarifications:
  - question: Can values repeat?
    answer: No.
  - question: What should empty traversals return?
    answer: None.
follow_ups:
  - Can you reconstruct from inorder and postorder?
  - Why are two traversals necessary?
common_mistakes:
  - {id: swaps-subtree-order, description: Builds the right subtree before the left while consuming preorder left-to-right., capability: trees.invariant}
visible_tests:
  - {args: [[3, 9, 20, 15, 7], [9, 3, 15, 20, 7]], expected: [3, 9, 20, null, null, 15, 7]}
  - {args: [[], []], expected: []}
hidden_tests:
  - {args: [[1], [1]], expected: [1]}
  - {args: [[1, 2, 3], [3, 2, 1]], expected: [1, 2, null, 3]}
  - {args: [[2, 1, 3], [1, 2, 3]], expected: [2, 1, 3]}
reference_solution: |
  def build_tree(preorder, inorder):
      positions = {value: index for index, value in enumerate(inorder)}
      preorder_index = 0
      def build(left, right):
          nonlocal preorder_index
          if left > right:
              return None
          value = preorder[preorder_index]
          preorder_index += 1
          node = TreeNode(value)
          middle = positions[value]
          node.left = build(left, middle - 1)
          node.right = build(middle + 1, right)
          return node
      return build(0, len(inorder) - 1)
wrong_solutions:
  - mistake: swaps-subtree-order
    expect: error
    code: |
      def build_tree(preorder, inorder):
          if not preorder:
              return None
          root = TreeNode(preorder[0])
          middle = inorder.index(preorder[0])
          root.right = build_tree(preorder[1:1 + len(inorder[middle + 1:])], inorder[middle + 1:])
          root.left = build_tree(preorder[1 + len(inorder[middle + 1:]):], inorder[:middle])
          return root

  "reference_solution": "class TreeCodec:\n    def serialize(self, values):\n        end=len(values)\n        while end and values[end-1] is None: end-=1\n        return ','.join('#' if x is None else str(x) for x in values[:end])\n    def deserialize(self, data):\n        if not data: return []\n        return [None if x=='#' else int(x) for x in data.split(',')]",

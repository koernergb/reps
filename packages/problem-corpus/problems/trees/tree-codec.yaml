hints:
- State precisely what information must be preserved after processing part of the input.
- Preserve null positions during breadth-first traversal so child relationships survive the round trip.
- 'Boundary check: Dropping internal null markers changes which parent owns later children.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Preserve null positions during breadth-first traversal so child relationships survive the round trip.
clarifications:
- question: What exact contract should `TreeCodec` implement?
  answer: Implement `TreeCodec.serialize` and `TreeCodec.deserialize` for level-order tree lists. Serialization uses comma-separated values and `#` null markers with unnecessary trailing nulls removed; an empty tree serializes to an empty string.
- question: Which boundary condition is easiest to overlook?
  answer: Dropping internal null markers changes which parent owns later children.
follow_ups:

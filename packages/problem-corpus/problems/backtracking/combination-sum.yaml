  "reference_solution": "def combination_sum(candidates,target):\n    out=[]; candidates.sort()\n    def dfs(start,left,path):\n        if left==0: out.append(path[:]); return\n        for i in range(start,len(candidates)):\n            x=candidates[i]\n            if x>left: break\n            path.append(x); dfs(i,left-x,path); path.pop()\n    dfs(0,target,[]); return out",

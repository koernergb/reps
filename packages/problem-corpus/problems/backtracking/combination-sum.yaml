statement: Given distinct positive integers `candidates` and a positive `target`, return every unique combination whose sum is `target`. A candidate may be used any number of times; combinations may be returned in any order.
examples:
- input:
    candidates:
    - 2
    - 3
    - 6
    - 7
    target: 7
  output:
  - - 2
    - 2
    - 3
  - - 7
constraints:
- The total input size is at most 10,000 elements.
- The input structure is valid and rectangular where a matrix is supplied.
kind: function
entrypoint: combination_sum
input_adapters: []
comparison: nested_unordered
starter_code: "def combination_sum(*args):\n    pass"
time_complexity: O(n)
space_complexity: O(n)

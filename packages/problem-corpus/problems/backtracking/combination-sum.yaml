hints:
- State precisely what information must be preserved after processing part of the input.
- Backtrack from a nondecreasing candidate index so reuse is allowed without generating permutations of the same combination.
- 'Boundary check: Restarting from index zero creates duplicate permutations; advancing too early prevents reuse.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Backtrack from a nondecreasing candidate index so reuse is allowed without generating permutations of the same combination.
clarifications:
- question: What exact contract should `combination_sum` implement?
  answer: Given distinct positive integers `candidates` and a positive `target`, return every unique combination whose sum is `target`. A candidate may be used any number of times; combinations may be returned in any order.
- question: Which boundary condition is easiest to overlook?
  answer: Restarting from index zero creates duplicate permutations; advancing too early prevents reuse.
follow_ups:
- Justify the claimed O(n) time and O(n) space bounds.
- 'Design a test that exposes this failure: Restarting from index zero creates duplicate permutations; advancing too early prevents reuse.'

statement: A robot starts at the top-left of a `rows` by `cols` grid and may move only right or down. Return the number of paths to the bottom-right.
examples:
- input:
    rows: 3
    cols: 7
  output: 28
constraints:
- The total input size is at most 10,000 elements.
- The input structure is valid and rectangular where a matrix is supplied.
kind: function
entrypoint: unique_paths
input_adapters: []
starter_code: "def unique_paths(*args):\n    pass"
time_complexity: O(rows * cols)
space_complexity: O(cols)

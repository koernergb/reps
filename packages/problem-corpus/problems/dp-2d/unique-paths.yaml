hints:
- State precisely what information must be preserved after processing part of the input.
- Each cell's path count is the sum of the counts immediately above and to its left.
- 'Boundary check: Initializing the first row or column to zero eliminates every path along that boundary.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Each cell's path count is the sum of the counts immediately above and to its left.
clarifications:
- question: What exact contract should `unique_paths` implement?
  answer: A robot starts at the top-left of a `rows` by `cols` grid and may move only right or down. Return the number of paths to the bottom-right.
- question: Which boundary condition is easiest to overlook?
  answer: Initializing the first row or column to zero eliminates every path along that boundary.
follow_ups:
- Justify the claimed O(rows * cols) time and O(cols) space bounds.
- 'Design a test that exposes this failure: Initializing the first row or column to zero eliminates every path along that boundary.'
common_mistakes:
- id: contract-boundary
  description: Initializing the first row or column to zero eliminates every path along that boundary.
  capability: dp-2d.recognition
- id: sample-overfit
  description: Handles the sample shape but does not implement the general contract.
  capability: dp-2d.recognition
visible_tests:
- args:
  - 3
  - 7
  expected: 28
hidden_tests:
- args:
  - 1
  - 1
  expected: 1
- args:
  - 3
  - 2
  expected: 3
reference_solution: "def unique_paths(rows, cols):\n    dp=[1]*cols\n    for _ in range(1,rows):\n        for c in range(1,cols): dp[c]+=dp[c-1]\n    return dp[-1]"
wrong_solutions:
- mistake: sample-overfit
  expect: wrong_answer
  code: "def unique_paths(*args):\n    return 28"

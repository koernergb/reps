  "reference_solution": "def lcs_length(a,b):\n    dp=[0]*(len(b)+1)\n    for x in a:\n        prev=0\n        for j,y in enumerate(b,1):\n            saved=dp[j]\n            dp[j]=prev+1 if x==y else max(dp[j],dp[j-1])\n            prev=saved\n    return dp[-1]",

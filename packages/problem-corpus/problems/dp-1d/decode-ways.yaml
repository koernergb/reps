  expected: 2
reference_solution: "def decode_ways(s):\n    prev2=1; prev1=0 if s[0]=='0' else 1\n    for i in range(1,len(s)):\n        cur=(prev1 if s[i]!='0' else 0)+(prev2 if 10<=int(s[i-1:i+1])<=26 else 0)\n        prev2,prev1=prev1,cur\n    return prev1"
wrong_solutions:
- mistake: sample-overfit
  expect: wrong_answer
  code: "def decode_ways(*args):\n    return 3"

hints:
- State precisely what information must be preserved after processing part of the input.
- At each position, add ways from a valid one-digit decode and a valid two-digit decode.
- 'Boundary check: Accepting `0` alone or accepting pairs outside 10 through 26 overcounts invalid decodings.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: At each position, add ways from a valid one-digit decode and a valid two-digit decode.
clarifications:
- question: What exact contract should `decode_ways` implement?
  answer: Digits map from `1` through `26` to letters A through Z. Return how many ways the entire nonempty digit string `s` can be decoded. A segment cannot have a leading zero.
- question: Which boundary condition is easiest to overlook?
  answer: Accepting `0` alone or accepting pairs outside 10 through 26 overcounts invalid decodings.
follow_ups:
- Justify the claimed O(n) time and O(1) space bounds.
- 'Design a test that exposes this failure: Accepting `0` alone or accepting pairs outside 10 through 26 overcounts invalid decodings.'

statement: Digits map from `1` through `26` to letters A through Z. Return how many ways the entire nonempty digit string `s` can be decoded. A segment cannot have a leading zero.
examples:
- input:
    s: '226'
  output: 3
constraints:
- 1 <= input length <= 20,000 where a sequence is supplied.
- Inputs fit signed 32-bit values unless the statement specifies unsigned values.

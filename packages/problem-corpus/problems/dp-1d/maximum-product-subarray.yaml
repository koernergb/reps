reference_solution: "def max_product(nums):\n    hi=lo=ans=nums[0]\n    for x in nums[1:]:\n        old=hi; hi=max(x,x*hi,x*lo); lo=min(x,x*old,x*lo); ans=max(ans,hi)\n    return ans"
wrong_solutions:
- mistake: sample-overfit
  expect: wrong_answer
  code: "def max_product(*args):\n    return 6"

hints:
- State precisely what information must be preserved after processing part of the input.
- Track both maximum and minimum products ending at each position because a negative value can swap their roles.
- 'Boundary check: Keeping only the maximum discards a large-magnitude negative product that a later negative value can flip.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Track both maximum and minimum products ending at each position because a negative value can swap their roles.
clarifications:
- question: What exact contract should `max_product` implement?
  answer: Return the largest product of a nonempty contiguous subarray of `nums`.
- question: Which boundary condition is easiest to overlook?
  answer: Keeping only the maximum discards a large-magnitude negative product that a later negative value can flip.
follow_ups:
- Justify the claimed O(n) time and O(1) space bounds.
- 'Design a test that exposes this failure: Keeping only the maximum discards a large-magnitude negative product that a later negative value can flip.'

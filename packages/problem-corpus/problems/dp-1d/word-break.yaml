transfer_group: prefix-segmentation
prerequisites: []
related: []
statement: Return whether `s` can be segmented completely into one or more words from `words`. Dictionary words may be reused.
examples:
- input:
    s: leetcode
    words:
    - leet
    - code
  output: true
constraints:
- 1 <= input length <= 20,000 where a sequence is supplied.
- Inputs fit signed 32-bit values unless the statement specifies unsigned values.
kind: function
entrypoint: word_break
input_adapters: []
starter_code: "def word_break(*args):\n    pass"
time_complexity: O(n)
space_complexity: O(n)
capabilities:
- slug: dp-1d.recognition
  weight: 0.2
- slug: dp-1d.invariant
  weight: 0.2
- slug: dp-1d.implementation
  weight: 0.2
- slug: dp-1d.boundaries
  weight: 0.2
- slug: dp-1d.complexity
  weight: 0.1
- slug: dp-1d.transfer
  weight: 0.1
hints:
- State precisely what information must be preserved after processing part of the input.
- Let `dp[i]` mean the prefix ending before `i` is segmentable, and extend only from reachable boundaries.
- 'Boundary check: A greedy choice of the longest or shortest matching word can block a valid later segmentation.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Let `dp[i]` mean the prefix ending before `i` is segmentable, and extend only from reachable boundaries.
clarifications:
- question: What exact contract should `word_break` implement?
  answer: Return whether `s` can be segmented completely into one or more words from `words`. Dictionary words may be reused.
- question: Which boundary condition is easiest to overlook?
  answer: A greedy choice of the longest or shortest matching word can block a valid later segmentation.
follow_ups:
- Justify the claimed O(n) time and O(n) space bounds.
- 'Design a test that exposes this failure: A greedy choice of the longest or shortest matching word can block a valid later segmentation.'
common_mistakes:
- id: contract-boundary
  description: A greedy choice of the longest or shortest matching word can block a valid later segmentation.
  capability: dp-1d.recognition
- id: sample-overfit
  description: Handles the sample shape but does not implement the general contract.
  capability: dp-1d.recognition
visible_tests:
- args:
  - leetcode
  - - leet
    - code
  expected: true
hidden_tests:
- args:
  - applepenapple
  - - apple
    - pen
  expected: true
- args:
  - catsandog
  - - cats
    - dog
    - sand
    - and
    - cat
  expected: false
reference_solution: "def word_break(s, words):\n    words=set(words); dp=[False]*(len(s)+1); dp[0]=True\n    for end in range(1,len(s)+1):\n        dp[end]=any(dp[start] and s[start:end] in words for start in range(end))\n    return dp[-1]"
wrong_solutions:
- mistake: sample-overfit
  expect: wrong_answer
  code: "def word_break(*args):\n    return True"

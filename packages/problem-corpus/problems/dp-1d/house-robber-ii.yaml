statement: Houses form a circle and `nums[i]` is the money in house `i`. Return the most money obtainable without robbing adjacent houses; the first and last houses are adjacent.
examples:
- input:
    nums:
    - 2
    - 3
    - 2
  output: 3
constraints:
- 1 <= input length <= 20,000 where a sequence is supplied.
- Inputs fit signed 32-bit values unless the statement specifies unsigned values.
kind: function
entrypoint: rob_circular
input_adapters: []
starter_code: "def rob_circular(*args):\n    pass"
time_complexity: O(n)
space_complexity: O(1)

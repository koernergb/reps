hints:
- State precisely what information must be preserved after processing part of the input.
- The optimum excludes either the first house or the last, so solve two ordinary linear robber ranges.
- 'Boundary check: Running the linear recurrence once can illegally select both endpoints.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: The optimum excludes either the first house or the last, so solve two ordinary linear robber ranges.
clarifications:
- question: What exact contract should `rob_circular` implement?
  answer: Houses form a circle and `nums[i]` is the money in house `i`. Return the most money obtainable without robbing adjacent houses; the first and last houses are adjacent.
- question: Which boundary condition is easiest to overlook?
  answer: Running the linear recurrence once can illegally select both endpoints.
follow_ups:
- Justify the claimed O(n) time and O(1) space bounds.
- 'Design a test that exposes this failure: Running the linear recurrence once can illegally select both endpoints.'
common_mistakes:
- id: contract-boundary
  description: Running the linear recurrence once can illegally select both endpoints.
  capability: dp-1d.recognition
- id: sample-overfit
  description: Handles the sample shape but does not implement the general contract.
  capability: dp-1d.recognition
visible_tests:
- args:
  - - 2
    - 3
    - 2
  expected: 3
hidden_tests:
- args:
  - - 1
  expected: 1
- args:
  - - 1
    - 2
    - 3
    - 1
  expected: 4
reference_solution: "def rob_circular(nums):\n    if len(nums)==1: return nums[0]\n    def linear(a):\n        prev=curr=0\n        for x in a: prev,curr=curr,max(curr,prev+x)\n        return curr\n    return max(linear(nums[:-1]),linear(nums[1:]))"
wrong_solutions:
- mistake: sample-overfit
  expect: wrong_answer
  code: "def rob_circular(*args):\n    return 3"

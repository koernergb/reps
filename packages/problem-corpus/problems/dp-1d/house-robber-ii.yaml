  "reference_solution": "def rob_circular(nums):\n    if len(nums)==1: return nums[0]\n    def linear(a):\n        prev=curr=0\n        for x in a: prev,curr=curr,max(curr,prev+x)\n        return curr\n    return max(linear(nums[:-1]),linear(nums[1:]))",

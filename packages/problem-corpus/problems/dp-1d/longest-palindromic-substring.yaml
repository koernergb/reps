hints:
- State precisely what information must be preserved after processing part of the input.
- Expand around every odd and even center; update the best only when a strictly longer palindrome is found.
- 'Boundary check: Checking only character centers misses even-length palindromes such as `bb`.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Expand around every odd and even center; update the best only when a strictly longer palindrome is found.
clarifications:

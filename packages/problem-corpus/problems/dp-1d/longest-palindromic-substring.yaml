reference_solution: "def longest_palindrome(s):\n    best=''\n    for c in range(len(s)):\n        for l,r in ((c,c),(c,c+1)):\n            while l>=0 and r<len(s) and s[l]==s[r]: l-=1; r+=1\n            if r-l-1>len(best): best=s[l+1:r]\n    return best"
wrong_solutions:
- mistake: sample-overfit
  expect: wrong_answer
  code: "def longest_palindrome(*args):\n    return 'bab'"

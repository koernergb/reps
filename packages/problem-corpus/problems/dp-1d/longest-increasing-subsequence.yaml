hints:
- State precisely what information must be preserved after processing part of the input.
- Maintain the smallest possible tail for an increasing subsequence of each length and replace tails by binary search.
- 'Boundary check: Using an upper-bound search treats equal values as increasing and overstates the length.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Maintain the smallest possible tail for an increasing subsequence of each length and replace tails by binary search.
clarifications:
- question: What exact contract should `lis_length` implement?
  answer: Return the length of the longest strictly increasing subsequence of `nums`. The chosen values need not be contiguous but must retain their original order.
- question: Which boundary condition is easiest to overlook?
  answer: Using an upper-bound search treats equal values as increasing and overstates the length.
follow_ups:

reference_solution: "def lis_length(nums):\n    from bisect import bisect_left\n    tails=[]\n    for x in nums:\n        i=bisect_left(tails,x)\n        if i==len(tails): tails.append(x)\n        else: tails[i]=x\n    return len(tails)"
wrong_solutions:

  "reference_solution": "def count_palindromes(s):\n    total=0\n    for c in range(len(s)):\n        for l,r in ((c,c),(c,c+1)):\n            while l>=0 and r<len(s) and s[l]==s[r]: total+=1; l-=1; r+=1\n    return total",

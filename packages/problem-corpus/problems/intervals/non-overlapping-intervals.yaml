reference_solution: "def erase_overlap_count(intervals):\n    end=float('-inf'); removed=0\n    for start,finish in sorted(intervals,key=lambda x:x[1]):\n        if start<end: removed+=1\n        else: end=finish\n    return removed"
wrong_solutions:
- mistake: sample-overfit
  expect: wrong_answer
  code: "def erase_overlap_count(*args):\n    return 1"

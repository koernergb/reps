hints:
- State precisely what information must be preserved after processing part of the input.
- Keep intervals in ascending end-time order; the earliest finishing compatible interval leaves the most room for the future.
- 'Boundary check: Keeping the interval that starts earliest can block several shorter intervals and cause excess removals.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Keep intervals in ascending end-time order; the earliest finishing compatible interval leaves the most room for the future.
clarifications:
- question: What exact contract should `erase_overlap_count` implement?
  answer: Return the minimum number of intervals to remove so the remaining intervals do not overlap. Touching endpoints do not overlap.
- question: Which boundary condition is easiest to overlook?
  answer: Keeping the interval that starts earliest can block several shorter intervals and cause excess removals.
follow_ups:

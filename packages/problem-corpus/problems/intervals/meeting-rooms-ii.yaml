hints:
- State precisely what information must be preserved after processing part of the input.
- Process starts and ends in time order, releasing every room whose meeting has ended before allocating the next.
- 'Boundary check: Treating an end time equal to a start time as overlap allocates an unnecessary room.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Process starts and ends in time order, releasing every room whose meeting has ended before allocating the next.
clarifications:
- question: What exact contract should `min_meeting_rooms` implement?
  answer: Given meeting intervals `[start, end]`, return the minimum number of rooms required so every meeting can occur. A room is reusable when one meeting ends exactly as another starts.
- question: Which boundary condition is easiest to overlook?
  answer: Treating an end time equal to a start time as overlap allocates an unnecessary room.
follow_ups:
- Justify the claimed O(n log n) time and O(n) space bounds.
- 'Design a test that exposes this failure: Treating an end time equal to a start time as overlap allocates an unnecessary room.'

statement: Given meeting intervals `[start, end]`, return the minimum number of rooms required so every meeting can occur. A room is reusable when one meeting ends exactly as another starts.
examples:
- input:
    intervals:
    - - 0
      - 30
    - - 5
      - 10
    - - 15
      - 20
  output: 2
constraints:
- 0 <= input length <= 20,000.
- All intervals and collections satisfy the structural contract in the statement.
kind: function
entrypoint: min_meeting_rooms
input_adapters: []
starter_code: "def min_meeting_rooms(*args):\n    pass"
time_complexity: O(n log n)
space_complexity: O(n)

  "reference_solution": "def min_meeting_rooms(intervals):\n    starts=sorted(x[0] for x in intervals); ends=sorted(x[1] for x in intervals)\n    used=best=j=0\n    for start in starts:\n        while j<len(ends) and ends[j]<=start: used-=1; j+=1\n        used+=1; best=max(best,used)\n    return best",

hints:
- State precisely what information must be preserved after processing part of the input.
- Sort by start, then either extend the last merged end or begin a new interval.
- 'Boundary check: Failing to sort first means an interval can overlap an earlier merged range without being adjacent in the input.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Sort by start, then either extend the last merged end or begin a new interval.
clarifications:
- question: What exact contract should `merge_intervals` implement?
  answer: Merge all overlapping intervals and return the disjoint intervals sorted by start. Intervals sharing an endpoint are considered overlapping.
- question: Which boundary condition is easiest to overlook?
  answer: Failing to sort first means an interval can overlap an earlier merged range without being adjacent in the input.
follow_ups:
- Justify the claimed O(n log n) time and O(n) space bounds.
- 'Design a test that exposes this failure: Failing to sort first means an interval can overlap an earlier merged range without being adjacent in the input.'

statement: Merge all overlapping intervals and return the disjoint intervals sorted by start. Intervals sharing an endpoint are considered overlapping.
examples:
- input:
    intervals:
    - - 1
      - 3
    - - 2
      - 6
    - - 8
      - 10
    - - 15
      - 18
  output:
  - - 1
    - 6
  - - 8
    - 10
  - - 15
    - 18
constraints:
- 0 <= input length <= 20,000.
- All intervals and collections satisfy the structural contract in the statement.

reference_solution: "def merge_intervals(intervals):\n    out=[]\n    for start,end in sorted(intervals):\n        if out and start<=out[-1][1]: out[-1][1]=max(out[-1][1],end)\n        else: out.append([start,end])\n    return out"
wrong_solutions:
- mistake: sample-overfit
  expect: wrong_answer
  code: "def merge_intervals(*args):\n    return [[1, 6], [8, 10], [15, 18]]"

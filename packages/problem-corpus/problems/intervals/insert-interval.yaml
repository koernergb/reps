hints:
- State precisely what information must be preserved after processing part of the input.
- Append intervals ending before the new interval, merge every overlap into the new interval, then append the remainder.
- 'Boundary check: Treating touching or overlapping boundaries inconsistently can leave mergeable intervals separate.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Append intervals ending before the new interval, merge every overlap into the new interval, then append the remainder.
clarifications:
- question: What exact contract should `insert_interval` implement?
  answer: Insert `new` into start-sorted, pairwise non-overlapping `intervals`, merging every overlap, and return the resulting sorted non-overlapping intervals.
- question: Which boundary condition is easiest to overlook?
  answer: Treating touching or overlapping boundaries inconsistently can leave mergeable intervals separate.
follow_ups:
- Justify the claimed O(n) time and O(n) space bounds.
- 'Design a test that exposes this failure: Treating touching or overlapping boundaries inconsistently can leave mergeable intervals separate.'

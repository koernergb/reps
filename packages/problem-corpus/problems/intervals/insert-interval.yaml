  "reference_solution": "def insert_interval(intervals,new):\n    out=[]; i=0\n    while i<len(intervals) and intervals[i][1]<new[0]: out.append(intervals[i]); i+=1\n    while i<len(intervals) and intervals[i][0]<=new[1]: new=[min(new[0],intervals[i][0]),max(new[1],intervals[i][1])]; i+=1\n    return out+[new]+intervals[i:]",

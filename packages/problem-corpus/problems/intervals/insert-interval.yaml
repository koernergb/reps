prerequisites: []
related: []
statement: Insert `new` into start-sorted, pairwise non-overlapping `intervals`, merging every overlap, and return the resulting sorted non-overlapping intervals.
examples:
- input:
    intervals:
    - - 1
      - 3
    - - 6
      - 9
    new:
    - 2
    - 5
  output:
  - - 1
    - 5
  - - 6
    - 9
constraints:
- 0 <= input length <= 20,000.
- All intervals and collections satisfy the structural contract in the statement.

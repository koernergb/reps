hints:
- State precisely what information must be preserved after processing part of the input.
- Keep a max-heap for the lower half and a min-heap for the upper half, balanced within one element.
- 'Boundary check: Balancing heap sizes without enforcing ordering can leave the wrong values at the two roots.'
- Trace the sample and the smallest valid input before coding.
- Before finishing, verify the claimed time and space complexity against the implementation.
key_insight: Keep a max-heap for the lower half and a min-heap for the upper half, balanced within one element.
clarifications:
- question: What exact contract should `MedianFinder` implement?
  answer: 'Implement `MedianFinder`: `add_num` inserts an integer and `find_median` returns the median of all inserted values. For an even count, return the average of the two middle values.'
- question: Which boundary condition is easiest to overlook?
  answer: Balancing heap sizes without enforcing ordering can leave the wrong values at the two roots.
follow_ups:

reference_solution: "class MedianFinder:\n    def __init__(self): self.low=[]; self.high=[]\n    def add_num(self,num):\n        import heapq\n        heapq.heappush(self.low,-num)\n        heapq.heappush(self.high,-heapq.heappop(self.low))\n        if len(self.high)>len(self.low): heapq.heappush(self.low,-heapq.heappop(self.high))\n    def find_median(self):\n        if len(self.low)>len(self.high): return -self.low[0]\n        return (-self.low[0]+self.high[0])/2"
wrong_solutions:
- mistake: incomplete-state
  expect: wrong_answer
  code: "class MedianFinder:\n    def __init__(self): self.values=[]\n    def add_num(self,n): self.values.append(n)\n    def find_median(self): return self.values[len(self.values)//2]"
